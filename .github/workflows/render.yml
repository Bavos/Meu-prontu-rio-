name: Render Meu Prontuario Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Instalar dependencias Node
        run: npm install

      - name: Renderizar video
        run: npm run artifact

      - name: Criar ZIP FINAL
        run: |
          mkdir -p final
          cp out/MeuProntuario_Comercial_30s_Silent.mp4 final/
          cp out/MeuProntuario_Thumbnail.png final/
          cp README.md final/
          zip -r MeuProntuario_FINAL.zip final

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeuProntuario_FINAL
          path: MeuProntuario_FINAL.zip
