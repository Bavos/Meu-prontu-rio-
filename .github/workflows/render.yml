name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meuprontuario-remotion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Install dependencies
        run: npm install

      - name: Create output folder
        run: mkdir -p out

      - name: Render MP4, Thumbnail and ZIP
        run: npm run artifact

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeuProntuario-Video-Final
          path: |
            meuprontuario-remotion/out/MeuProntuario_Comercial_30s_Silent.mp4
            meuprontuario-remotion/out/MeuProntuario_Thumbnail.png
            meuprontuario-remotion/out/MeuProntuario_Remotion.zip
            meuprontuario-remotion/README.md
          if-no-files-found: error
