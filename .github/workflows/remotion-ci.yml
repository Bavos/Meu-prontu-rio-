name: Remotion CI

on:
  pull_request:
    paths:
      - 'remotion/**'
      - '.github/workflows/remotion-ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'remotion/**'
      - '.github/workflows/remotion-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Remotion project
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: remotion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate silent video rules
        run: npm run validate:silent

      - name: Typecheck
        run: npx tsc --noEmit
